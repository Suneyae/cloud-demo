name: Auto Merge release/sit → release/uat

on:
  push:
    branches: [release/sit]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR and merge to release/uat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # 1. 创建 PR（已存在则复用）
          PR_URL=$(gh pr create \
            --base release/uat \
            --head release/sit \
            --title "auto: release/sit → release/uat [${{ github.run_number }}]" \
            --body "Auto-generated by GitHub Actions" 2>/dev/null \
            || gh pr view release/sit --json url -q .url)
          echo "PR: $PR_URL"

          # 2. 检查合并状态，冲突则终止并给出链接
          STATE=$(gh pr view release/sit --json mergeable -q .mergeable)
          if [ "$STATE" = "CONFLICTING" ]; then
            echo "::error::合并冲突，请人工处理: $PR_URL"
            exit 1
          fi

          # 3. 执行合并（有检查就开 auto 等待，没有直接合）
          gh pr merge --auto --merge "$PR_URL" || gh pr merge --merge "$PR_URL"
          echo "Merged: $PR_URL"