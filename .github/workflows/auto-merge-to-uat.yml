name: Auto Merge release/sit → release/uat

on:
  push:
    branches: [release/sit]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库代码，解决 not a git repository 报错
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup GitHub CLI
        uses: cli/setup-gh@v1

      - name: Create PR and merge to release/uat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 先查询是否已经存在 sit -> uat 的PR
          PR_INFO=$(gh pr list --head release/sit --base release/uat --json url,number -q '.[0]')
          PR_URL=$(echo "$PR_INFO" | jq -r .url)

          if [[ "$PR_URL" == "null" ]]; then
            echo "✅ 不存在PR，新建PR"
            PR_URL=$(gh pr create \
              --base release/uat \
              --head release/sit \
              --title "auto: release/sit → release/uat [${{ github.run_number }}]" \
              --body "Auto-generated by GitHub Actions")
          fi
          echo "PR: $PR_URL"

          # ✅ 用PR_URL查询，不再传分支名！
          STATE=$(gh pr view "$PR_URL" --json mergeable -q .mergeable)
          echo "mergeable state: $STATE"

          if [ "$STATE" = "CONFLICTING" ]; then
            echo "::error::合并冲突，请人工处理: $PR_URL"
            exit 1
          fi

          # 尝试开启auto merge，失败则直接合并
          if gh pr merge --auto --merge "$PR_URL"; then
            echo "✅ 已开启Auto merge，等待检查通过自动合并"
          else
            echo "⚠️ --auto 失败，尝试直接合并"
            gh pr merge --merge "$PR_URL"
          fi
          echo "🎉 流程结束"
